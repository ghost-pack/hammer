asdfasdfste ps
  - name: "ubuntu"
    id: "test"
    entrypoint: "bash"
    args:
      - "-eEuo"
      - "pipefail"
      - "-c"
      - |-
        echo "$_GIT_CLONE_URL"
        echo "$_GIT_REPOSITORY_NAME"
        echo "$_GIT_REF"
        echo "$_GIT_HEAD_SHA"

substitutions
  _GIT_REPOSITORY_NAME: $(body.repository.name)
  _GIT_CLONE_URL: $(body.repository.clone_url)
  _GIT_REF: $(body.ref)
  _GIT_HEAD_SHA: $(body.head_commit.id)

options
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY