version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      # Optional: Set memory limits or other configs
    volumes:
      - jaeger_data:/tmp  # persist traces (optional)
    restart: unless-stopped

volumes:
  jaeger_data: